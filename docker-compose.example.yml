services:
  social-to-mealie:
    restart: unless-stopped
    image: ghcr.io/twix99b/social-to-mealie:latest
    container_name: social-to-mealie
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LOCAL_TRANSCRIPTION_MODEL=Xenova/whisper-small
      - MEALIE_URL=http://mealie:9000
      - EXTERNAL_MEALIE_URL=https://mealie.example.com # optional
      - MEALIE_API_KEY=${MEALIE_API_KEY}
      - MEALIE_GROUP_NAME=home
      - GOTIFY_URL=https://gotify.example.com # optional
      - GOTIFY_TOKEN=${GOTIFY_TOKEN} # optional
      - APP_URL=https://social-to-mealie.example.com # optional, for links in notifications
      - YTDLP_VERSION=latest
    volumes:
      - ./data:/app/data # jobs, drafts, settings, images, Whisper model (chown 1001:1001)
      - ./cookies.txt:/app/cookies.txt # optional, for Instagram / Facebook
    ports:
      - 4000:3000
    security_opt:
      - no-new-privileges:true
